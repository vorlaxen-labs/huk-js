name: Bug report
description: Report incorrect behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 2.0.0
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
